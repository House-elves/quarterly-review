# A House Elves elf: what Elf Desk needs to install, set up and run quarterly-review.
name: quarterly-review
title: Quarterly review
description: Writes your quarterly accomplishments from your GitHub work and weekly statuses, for its tab.
main: QuarterlyReview.java
config: ~/.config/quarterly-review/config
tools: [gh, claude]

reads:
  - Your GitHub activity for the quarter, through gh.
  - The weekly statuses weekly-status saved on this machine, if there are any.
writes:
  - Nothing outside this machine. The review is saved for its tab on the desk.

settings:
  - key: DISPLAY_NAME
    label: Your name
    help: Who the review is about.
    kind: text
  - key: GITHUB_USER
    label: GitHub account
    help: Whose work goes in the review.
    kind: login
    default: ${github-user}
  - key: EXCLUDE_ORGS
    label: Leave out these orgs
    help: Comma-separated GitHub orgs whose work isn't part of the review.
    kind: words
    default: ""

commands:
  review:
    label: Review the last quarter
    args: [--save]
    # The tab picks the quarter (--quarter=2026-Q3); without one it's the last quarter that ended.
    params:
      quarter: {pattern: "\\d{4}-Q[1-4]", optional: true}

dry-run: review

# Its tab on the desk, drawn by ui/quarterly.js in the desk's sandboxed frame. It reads only the reviews it saved.
# Refreshing writes the review of the last quarter that ended; it runs on its own only if you give it a schedule.
tab:
  page: ui/quarterly.js
refresh: review
data: [runs]
